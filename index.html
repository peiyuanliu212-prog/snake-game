<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>贪吃蛇大作战</title>
<style>
  :root{
    --bg:#0d2013; --panel:#17351f; --panel2:#1e4228; --line:#2c5a38;
    --ink:#eef7ee; --muted:#a7c4ab; --accent:#57c84b; --accent-d:#3da332;
    --red:#e5484d; --gold:#f5b301; --card:#122b18;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    padding-top:env(safe-area-inset-top);
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:460px; padding:14px 14px 20px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .title{font-size:24px; font-weight:900; letter-spacing:2px;}
  .title .dot{color:var(--accent);}
  .sound-btn{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center;}
  .stat b{display:block; font-size:19px; line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; color:var(--muted);}
  .board-wrap{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px;}
  canvas{display:block; width:100%; aspect-ratio:1/1; background:#0a1a0e; border-radius:10px; touch-action:none;}
  .toast{
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#231a00; font-weight:700; font-size:14px;
    padding:6px 14px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .overlay{
    position:absolute; inset:10px; background:rgba(8,20,11,.92); border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px 16px; gap:12px;
  }
  .overlay[hidden]{display:none;}
  .overlay h2{font-size:26px; letter-spacing:3px;}
  .overlay p{color:var(--muted); font-size:13px; line-height:1.7;}
  .modes{display:flex; gap:8px;}
  .mode{
    background:var(--panel2); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer;
  }
  .mode.on{background:var(--accent); border-color:var(--accent); color:#0a1a0e; font-weight:800;}
  .mode-desc{font-size:12px; color:var(--muted); min-height:16px;}
  .big-btn{
    background:var(--accent); color:#0a1a0e; border:none; border-radius:12px;
    font-size:17px; font-weight:900; letter-spacing:2px; padding:13px 42px; cursor:pointer;
  }
  .big-btn:active{background:var(--accent-d);}
  .ghost-btn{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:12px; font-size:14px; padding:10px 22px; cursor:pointer;
  }
  .btn-row{display:flex; gap:10px;}
  .final-score{font-size:44px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .rating{color:var(--gold); font-weight:700; font-size:15px;}
  .rules{text-align:left; font-size:12.5px; color:var(--muted); line-height:1.9; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
  .rules b{color:var(--ink);}
  .controls{display:flex; gap:8px; margin-top:10px;}
  .controls button{
    flex:1; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:11px 0; font-size:14px; cursor:pointer;
  }
  .dpad{display:none; margin-top:12px; user-select:none;}
  .dpad .row{display:flex; justify-content:center; gap:10px; margin-bottom:10px;}
  .dpad button{
    width:64px; height:52px; font-size:20px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:12px; cursor:pointer;
  }
  .dpad button:active{background:var(--accent); color:#0a1a0e;}
  @media (max-width:520px){ .dpad{display:block;} }
  .foot{margin-top:12px; text-align:center; color:var(--muted); font-size:11.5px; line-height:1.7;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">贪吃蛇大作战</div>
    <button class="sound-btn" id="soundBtn" type="button">音效：开</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="stScore">0</b><span>得分</span></div>
    <div class="stat"><b id="stBest">0</b><span>最高分</span></div>
    <div class="stat"><b id="stLen">3</b><span>长度</span></div>
    <div class="stat"><b id="stSpeed">1</b><span>速度等级</span></div>
  </div>

  <div class="board-wrap">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="toast" id="toast"></div>

    <div class="overlay" id="startPanel">
      <h2>贪吃蛇大作战</h2>
      <div class="modes" id="modeRow">
        <button class="mode on" data-mode="classic" type="button">经典</button>
        <button class="mode" data-mode="wrap" type="button">穿墙</button>
        <button class="mode" data-mode="block" type="button">障碍</button>
      </div>
      <div class="mode-desc" id="modeDesc">撞墙或咬到自己结束，老规矩。</div>
      <div class="rules">
        <b>红苹果</b> +10 分，长一节<br>
        <b>金苹果</b> 限时 6 秒，吃到 +30 分<br>
        每吃 5 个苹果，速度升一级<br>
        键盘方向键 / WASD 移动，空格暂停；手机滑动或按方向键
      </div>
      <button class="big-btn" id="startBtn" type="button">开始游戏</button>
      <p id="startBest">最高分 0</p>
    </div>

    <div class="overlay" id="pausePanel" hidden>
      <h2>已暂停</h2>
      <p>按空格或点继续，接着玩。</p>
      <button class="big-btn" id="resumeBtn" type="button">继续游戏</button>
    </div>

    <div class="overlay" id="overPanel" hidden>
      <h2>游戏结束</h2>
      <div class="final-score" id="finalScore">0</div>
      <div class="rating" id="ratingText"></div>
      <p id="overReason">撞墙了</p>
      <div class="btn-row">
        <button class="big-btn" id="againBtn" type="button">再来一局</button>
        <button class="ghost-btn" id="changeBtn" type="button">换模式</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="pauseBtn" type="button">暂停</button>
    <button id="restartBtn" type="button">重开</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="row"><button data-dir="up" type="button">↑</button></div>
    <div class="row">
      <button data-dir="left" type="button">←</button>
      <button data-dir="down" type="button">↓</button>
      <button data-dir="right" type="button">→</button>
    </div>
  </div>

  <div class="foot">三种模式各记各的最高分，成绩保存在本机。</div>
</div>

<script>
"use strict";
var GRID = 20, CELL = 20;
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");

var MODES = {
  classic: { name: "经典", desc: "撞墙或咬到自己结束，老规矩。", base: 150 },
  wrap:    { name: "穿墙", desc: "可以穿过四面墙，咬到自己才结束。", base: 140 },
  block:   { name: "障碍", desc: "场上有石块，得分越高石块越多，撞上就结束。", base: 150 }
};

var state = {
  mode: "classic",
  snake: [], dir: {x:1,y:0}, nextDirs: [],
  food: null, gold: null, goldDeadline: 0,
  blocks: [], score: 0, eaten: 0, speedLevel: 1,
  running: false, paused: false, over: false,
  timer: null, sound: true, lastMilestone: 0
};

function bestKey(){ return "snake_best_" + state.mode; }
function getBest(){
  try { return parseInt(localStorage.getItem(bestKey()) || "0", 10) || 0; }
  catch(e){ return state._best || 0; }
}
function setBest(v){
  state._best = v;
  try { localStorage.setItem(bestKey(), String(v)); } catch(e){}
}

var AC = null;
function beep(freq, dur, type){
  if(!state.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.06));
  }catch(e){}
}

function randCell(){
  return { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
}
function cellTaken(c){
  var i, s = state.snake;
  for(i=0;i<s.length;i++) if(s[i].x===c.x && s[i].y===c.y) return true;
  for(i=0;i<state.blocks.length;i++) if(state.blocks[i].x===c.x && state.blocks[i].y===c.y) return true;
  if(state.food && state.food.x===c.x && state.food.y===c.y) return true;
  if(state.gold && state.gold.x===c.x && state.gold.y===c.y) return true;
  return false;
}
function placeFood(){
  var c; do { c = randCell(); } while(cellTaken(c));
  state.food = c;
}
function maybeGold(){
  if(state.gold) return;
  if(Math.random() < 0.3){
    var c; do { c = randCell(); } while(cellTaken(c));
    state.gold = c;
    state.goldDeadline = Date.now() + 6000;
  }
}
function seedBlocks(){
  state.blocks = [];
  if(state.mode !== "block") return;
  var n = 5, guard = 0, c;
  while(state.blocks.length < n && guard++ < 200){
    c = randCell();
    if(Math.abs(c.x-3) <= 2 && Math.abs(c.y-10) <= 2) continue;
    if(!cellTaken(c)) state.blocks.push(c);
  }
}
function addBlocks(){
  var guard = 0, c, added = 0;
  while(added < 2 && guard++ < 100){
    c = randCell();
    if(!cellTaken(c)){ state.blocks.push(c); added++; }
  }
}

function tickMs(){
  var base = MODES[state.mode].base;
  var ms = base - (state.speedLevel - 1) * 9;
  return Math.max(65, ms);
}
function armTimer(){
  clearInterval(state.timer);
  state.timer = setInterval(step, tickMs());
}

function startGame(){
  state.snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  state.dir = {x:1,y:0}; state.nextDirs = [];
  state.score = 0; state.eaten = 0; state.speedLevel = 1;
  state.gold = null; state.lastMilestone = 0;
  state.running = true; state.paused = false; state.over = false;
  seedBlocks();
  placeFood();
  showPanel(null);
  syncStats();
  armTimer();
  draw();
}
function endGame(reason){
  state.running = false; state.over = true;
  clearInterval(state.timer);
  var isBest = state.score > getBest();
  if(isBest) setBest(state.score);
  document.getElementById("finalScore").textContent = state.score;
  document.getElementById("overReason").textContent = reason + (isBest ? " · 新纪录！" : " · 最高分 " + getBest());
  document.getElementById("ratingText").textContent = rating(state.score);
  showPanel("overPanel");
  beep(160, 0.25, "sawtooth");
  draw();
}
function rating(s){
  if(s >= 300) return "蛇王本王";
  if(s >= 200) return "身法拉满";
  if(s >= 120) return "渐入佳境";
  if(s >= 60)  return "小有所成";
  if(s >= 30)  return "刚刚热身";
  return "再接再厉";
}
function togglePause(force){
  if(!state.running) return;
  state.paused = (typeof force === "boolean") ? force : !state.paused;
  if(state.paused){ clearInterval(state.timer); showPanel("pausePanel"); }
  else { showPanel(null); armTimer(); }
}

function step(){
  if(state.gold && Date.now() > state.goldDeadline){
    state.gold = null;
  }
  if(state.nextDirs.length){
    var nd = state.nextDirs.shift();
    if(!(nd.x === -state.dir.x && nd.y === -state.dir.y)) state.dir = nd;
  }
  var head = { x: state.snake[0].x + state.dir.x, y: state.snake[0].y + state.dir.y };

  if(state.mode === "wrap"){
    head.x = (head.x + GRID) % GRID;
    head.y = (head.y + GRID) % GRID;
  } else {
    if(head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID){
      endGame("撞墙了"); return;
    }
  }
  var i;
  for(i=0;i<state.blocks.length;i++){
    if(state.blocks[i].x===head.x && state.blocks[i].y===head.y){ endGame("撞上石块了"); return; }
  }
  var willEat = state.food && head.x===state.food.x && head.y===state.food.y;
  var willGold = state.gold && head.x===state.gold.x && head.y===state.gold.y;
  var bodyLimit = (willEat || willGold) ? state.snake.length : state.snake.length - 1;
  for(i=0;i<bodyLimit;i++){
    if(state.snake[i].x===head.x && state.snake[i].y===head.y){ endGame("咬到自己了"); return; }
  }

  state.snake.unshift(head);
  if(willGold){
    state.score += 30; state.gold = null;
    beep(880, 0.09, "square");
    toast("金苹果 +30");
  } else if(willEat){
    state.score += 10; state.eaten++;
    state.food = null;
    beep(520, 0.06, "square");
    var lv = Math.floor(state.eaten / 5) + 1;
    if(lv !== state.speedLevel){
      state.speedLevel = lv;
      armTimer();
      toast("加速！速度等级 " + lv);
    }
    if(state.mode === "block" && state.score % 50 === 0) addBlocks();
    placeFood();
    maybeGold();
  } else {
    state.snake.pop();
  }

  var mile = Math.floor(state.score / 100) * 100;
  if(mile > 0 && mile > state.lastMilestone){
    state.lastMilestone = mile;
    toast("突破 " + mile + " 分！");
    beep(660, 0.08, "triangle");
  }
  syncStats();
  draw();
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1300);
}

function syncStats(){
  document.getElementById("stScore").textContent = state.score;
  document.getElementById("stBest").textContent = Math.max(getBest(), state.score);
  document.getElementById("stLen").textContent = state.snake.length;
  document.getElementById("stSpeed").textContent = state.speedLevel;
  document.getElementById("startBest").textContent =
    MODES[state.mode].name + "模式 · 最高分 " + getBest();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function draw(){
  ctx.fillStyle = "#0a1a0e";
  ctx.fillRect(0, 0, 400, 400);
  ctx.strokeStyle = "rgba(87,200,75,.07)";
  ctx.lineWidth = 1;
  var i;
  for(i=1;i<GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL+.5, 0); ctx.lineTo(i*CELL+.5, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL+.5); ctx.lineTo(400, i*CELL+.5); ctx.stroke();
  }
  // 石块
  ctx.fillStyle = "#5b6b5e";
  for(i=0;i<state.blocks.length;i++){
    var b = state.blocks[i];
    roundRect(b.x*CELL+2, b.y*CELL+2, CELL-4, CELL-4, 4); ctx.fill();
  }
  // 苹果
  if(state.food){
    ctx.fillStyle = "#e5484d";
    ctx.beginPath();
    ctx.arc(state.food.x*CELL+10, state.food.y*CELL+11, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#57c84b";
    ctx.fillRect(state.food.x*CELL+9, state.food.y*CELL+2, 2, 4);
  }
  // 金苹果（带剩余时间环）
  if(state.gold){
    var left = Math.max(0, (state.goldDeadline - Date.now()) / 6000);
    ctx.fillStyle = "#f5b301";
    ctx.beginPath();
    ctx.arc(state.gold.x*CELL+10, state.gold.y*CELL+10, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#f5b301"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(state.gold.x*CELL+10, state.gold.y*CELL+10, 10, -Math.PI/2, -Math.PI/2 + Math.PI*2*left);
    ctx.stroke();
  }
  // 蛇身
  for(i=state.snake.length-1;i>=0;i--){
    var s = state.snake[i];
    var t = state.snake.length <= 1 ? 0 : i/(state.snake.length-1);
    var g = Math.round(200 - t*70), r = Math.round(87 - t*30);
    ctx.fillStyle = "rgb(" + r + "," + g + ",75)";
    roundRect(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3, i===0 ? 7 : 5);
    ctx.fill();
    if(i===0){
      ctx.fillStyle = "#0a1a0e";
      var ex = state.dir.x, ey = state.dir.y;
      var cx = s.x*CELL+10, cy = s.y*CELL+10;
      var px = -ey, py = ex;
      ctx.beginPath(); ctx.arc(cx + ex*3 + px*3.5, cy + ey*3 + py*3.5, 1.8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex*3 - px*3.5, cy + ey*3 - py*3.5, 1.8, 0, Math.PI*2); ctx.fill();
    }
  }
}

function showPanel(id){
  var panels = ["startPanel", "pausePanel", "overPanel"];
  for(var i=0;i<panels.length;i++){
    document.getElementById(panels[i]).hidden = (panels[i] !== id);
  }
}
function setMode(m){
  if(state.running) return;
  state.mode = m;
  var btns = document.querySelectorAll("#modeRow .mode");
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === m);
  }
  document.getElementById("modeDesc").textContent = MODES[m].desc;
  syncStats();
}
function queueDir(x, y){
  var last = state.nextDirs.length ? state.nextDirs[state.nextDirs.length-1] : state.dir;
  if(last.x === x && last.y === y) return;
  if(state.nextDirs.length < 3) state.nextDirs.push({x:x, y:y});
}

document.getElementById("modeRow").addEventListener("click", function(e){
  var m = e.target.getAttribute && e.target.getAttribute("data-mode");
  if(m) setMode(m);
});
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);
document.getElementById("resumeBtn").addEventListener("click", function(){ togglePause(false); });
document.getElementById("changeBtn").addEventListener("click", function(){
  state.over = false; showPanel("startPanel"); syncStats();
});
document.getElementById("pauseBtn").addEventListener("click", function(){
  if(state.running) togglePause();
});
document.getElementById("restartBtn").addEventListener("click", function(){
  if(state.running || state.over) startGame();
});
document.getElementById("soundBtn").addEventListener("click", function(){
  state.sound = !state.sound;
  this.textContent = state.sound ? "音效：开" : "音效：关";
});
document.getElementById("dpad").addEventListener("click", function(e){
  var d = e.target.getAttribute && e.target.getAttribute("data-dir");
  if(!d || !state.running) return;
  if(d==="up") queueDir(0,-1);
  if(d==="down") queueDir(0,1);
  if(d==="left") queueDir(-1,0);
  if(d==="right") queueDir(1,0);
});

document.addEventListener("keydown", function(e){
  var k = e.key;
  if(k === " "){
    e.preventDefault();
    if(state.running) togglePause();
    else startGame();
    return;
  }
  if(k === "Enter" && !state.running){ startGame(); return; }
  if(!state.running || state.paused) return;
  if(k === "ArrowUp" || k === "w" || k === "W"){ queueDir(0,-1); e.preventDefault(); }
  else if(k === "ArrowDown" || k === "s" || k === "S"){ queueDir(0,1); e.preventDefault(); }
  else if(k === "ArrowLeft" || k === "a" || k === "A"){ queueDir(-1,0); e.preventDefault(); }
  else if(k === "ArrowRight" || k === "d" || k === "D"){ queueDir(1,0); e.preventDefault(); }
});

var touchStart = null;
cv.addEventListener("touchstart", function(e){
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });
cv.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive: false });
cv.addEventListener("touchend", function(e){
  if(!touchStart || !state.running) return;
  var dx = e.changedTouches[0].clientX - touchStart.x;
  var dy = e.changedTouches[0].clientY - touchStart.y;
  if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if(Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
  else queueDir(0, dy > 0 ? 1 : -1);
  touchStart = null;
});

state.snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
seedBlocks();
placeFood();
syncStats();
draw();
</script>
</body>
</html>
